#
# aviengine test config: dead connection detection and idle connection recycling enabled
#

postgis:
{
	host		= "smartmet-test";
	port		= 5444;
	database	= "avi";
	username	= "avi_user";
	password	= "avi_pw";
	encoding	= "UTF8";

	connecttimeout	   = 10;
	tcpusertimeout	   = 30000;
	keepalivesidle	   = 60;
	keepalivesinterval = 10;
	keepalivescount	   = 3;
	maxidletime	   = 300;
};

message:
{
	maxstations	 = 0;
	maxrows		 = 0;

	recordsetstarttimeoffsethours = 30;
	recordsetendtimeoffsethours = 12;

	types =
	(
		{
			name = "METAR";
			timerangetype = "messagetime";
			validityhours = 2;
			latestmessage = true;
		}
	);
}
